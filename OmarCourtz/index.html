<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Por Si Mañana No Estoy — Omar Courtz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh; /* evita el salto con la barra del navegador en móvil */
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .bg {
    position: fixed;
    inset: 0;
    background-image: url('fondo.jpg'); /* <-- sube tu imagen con este nombre */
    background-size: cover;
    background-position: center;
    z-index: -2;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
  }
  .container {
    height: 100%;
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    cursor: pointer;
  }
  h1 {
    font-size: clamp(22px, 5vw, 34px);
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  p.subtitle {
    color: #ddd;
    margin: 0 0 40px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }
  #embed-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    transform: translateY(100%);
    transition: transform .35s ease;
  }
  #embed-wrap.visible { transform: translateY(0); }
  #embed-iframe { width: 100%; max-width: 500px; margin: 0 auto; }
</style>
</head>
<body>
  <div class="bg"></div>
  <!-- El propio contenedor central hace de botón de "play": el primer toque cuenta
       como interacción del usuario y desbloquea el autoplay del navegador -->
  <div class="container" id="start-layer">
    <h1>POR SI MAÑANA NO ESTOY</h1>
    <p class="subtitle">Omar Courtz · toca para escuchar (empieza en 1:20)</p>
  </div>
  <div id="embed-wrap">
    <iframe id="sc-widget"
      width="100%" height="80" scrolling="no" frameborder="no"
      allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fomar-courtz%2Fpor-si-manana-no-estoy&color=%231db954&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false">
    </iframe>
  </div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
  const START_SECONDS = 80; // 1:20
  const START_MS = START_SECONDS * 1000;

  const iframeEl = document.getElementById('sc-widget');
  const startLayer = document.getElementById('start-layer');
  const widget = SC.Widget(iframeEl);

  let widgetReady = false;
  let seeked = false;

  widget.bind(SC.Widget.Events.READY, () => {
    widgetReady = true;
    // Si el usuario ya tocó antes de que el widget estuviera listo, arrancamos ya
    if (startLayer.dataset.tapped === '1') startPlayback();
  });

  widget.bind(SC.Widget.Events.PLAY, () => {
    document.getElementById('embed-wrap').classList.add('visible');
    // seekTo solo funciona de forma fiable una vez ya empezó a sonar,
    // así que saltamos al minuto 1:20 justo al primer PLAY
    if (!seeked) {
      seeked = true;
      widget.seekTo(START_MS);
    }
  });

  function startPlayback() {
    startLayer.style.display = 'none';
    if (widgetReady) {
      widget.play();
    } else {
      startLayer.dataset.tapped = '1'; // se reproducirá en cuanto el widget avise READY
    }
  }

  // Primer toque/clic en cualquier parte de la pantalla = "play"
  startLayer.addEventListener('click', startPlayback, { once: true });
</script>
</body>
</html>
