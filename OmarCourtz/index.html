<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Por Si Mañana No Estoy — Omar Courtz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh; /* evita el salto con la barra del navegador en móvil */
    background: #000; /* si queda algún hueco, que sea negro y no blanco */
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Fondo a pantalla completa */
  .bg {
    position: fixed;
    inset: 0;
    background-image: url('fondo.jpg'); /* <-- sube tu imagen con este nombre */
    background-size: cover;
    background-position: center;
    z-index: -2;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45); /* oscurece un poco para que se lea el texto */
  }

  .container {
    height: 100%;
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  h1 {
    font-size: clamp(22px, 5vw, 34px);
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  p.subtitle {
    color: #ddd;
    margin: 0 0 40px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }

  /* El reproductor de SoundCloud se muestra pequeño abajo en cuanto suena */
  #embed-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    transform: translateY(100%);
    transition: transform .35s ease;
  }
  #embed-wrap.visible { transform: translateY(0); }
  #embed-iframe { width: 100%; max-width: 500px; margin: 0 auto; }
</style>
</head>
<body>

  <div class="bg"></div>

  <div class="container">
    <h1>POR SI MAÑANA NO ESTOY</h1>
    <p class="subtitle">Omar Courtz · empieza en 1:20</p>
  </div>

  <div id="embed-wrap">
    <iframe id="sc-widget"
      width="100%" height="80" scrolling="no" frameborder="no"
      allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fomar-courtz%2Fpor-si-manana-no-estoy&color=%231db954&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false">
    </iframe>
  </div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
  const TRACK_URL = 'https://soundcloud.com/omar-courtz/por-si-manana-no-estoy';
  const START_SECONDS = 80; // 1:20
  const START_MS = START_SECONDS * 1000; // SoundCloud también pide milisegundos

  let widget = null;
  let widgetReady = false;

  const iframeEl = document.getElementById('sc-widget');
  widget = SC.Widget(iframeEl);

  widget.bind(SC.Widget.Events.PLAY, () => {
    document.getElementById('embed-wrap').classList.add('visible');
  });

  widget.bind(SC.Widget.Events.READY, () => {
    widgetReady = true;
    widget.seekTo(START_MS);
    widget.play();
  });

  // Si el widget de SoundCloud ni siquiera confirma "listo" (bloqueado, sin red...),
  // abrimos la canción directamente en SoundCloud como último recurso.
  setTimeout(() => {
    if (!widgetReady) window.open(TRACK_URL, '_blank');
  }, 5000);
</script>
</body>
</html>
