<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Por Si Mañana No Estoy — Omar Courtz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh; /* evita el salto con la barra del navegador en móvil */
    background: #000; /* si queda algún hueco, que sea negro y no blanco */
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Fondo a pantalla completa */
  .bg {
    position: fixed;
    inset: 0;
    background-image: url('fondo.jpg'); /* <-- sube tu imagen con este nombre */
    background-size: cover;
    background-position: center;
    z-index: -2;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45); /* oscurece un poco para que se lea el texto */
  }

  .container {
    height: 100%;
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  h1 {
    font-size: clamp(22px, 5vw, 34px);
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  p.subtitle {
    color: #ddd;
    margin: 0 0 40px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }

  #playButton {
    padding: clamp(14px, 4vw, 18px) clamp(28px, 8vw, 40px);
    border: none;
    border-radius: 50px;
    background: #1DB954;
    color: #fff;
    font-size: clamp(16px, 4.5vw, 18px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    transition: transform .15s ease, background .15s ease;
    max-width: 90vw;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  #playButton:hover { background: #1ed760; transform: scale(1.03); }
  #playButton:active { transform: scale(0.97); }
  #playButton.hidden { display: none; }

  /* El reproductor de Spotify se muestra pequeño abajo, solo tras dar play */
  #embed-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    transform: translateY(100%);
    transition: transform .35s ease;
  }
  #embed-wrap.visible { transform: translateY(0); }
  #embed-iframe { width: 100%; max-width: 500px; margin: 0 auto; }

  #fallback {
    margin-top: 22px;
    font-size: 14px;
    color: #ccc;
    max-width: 320px;
  }
  #fallback a { color: #1ed760; }
</style>
</head>
<body>

  <div class="bg"></div>

  <div class="container">
    <h1>POR SI MAÑANA NO ESTOY</h1>
    <p class="subtitle">Omar Courtz · empieza en 1:20</p>

    <button id="playButton">▶ Reproducir</button>

    <p id="fallback" style="display:none;">
      ¿No suena? <a id="fallbackLink" href="#" target="_blank" rel="noopener">Ábrela en Spotify</a>
      (tendrás que adelantar manualmente hasta 1:20)
    </p>
  </div>

  <div id="embed-wrap">
    <div id="embed-iframe"></div>
  </div>

<script>
  const TRACK_URI = 'spotify:track:5FIvygEAeCSTFO6lY3Cda0';
  const TRACK_URL = 'https://open.spotify.com/track/5FIvygEAeCSTFO6lY3Cda0';
  const START_SECONDS = 80;           // 1:20
  const START_MS = START_SECONDS * 1000; // la API pide milisegundos

  let EmbedController = null;
  let apiReady = false;

  window.onSpotifyIframeApiReady = (IFrameAPI) => {
    apiReady = true;
    const element = document.getElementById('embed-iframe');
    const options = { width: '100%', height: 80, uri: TRACK_URI };
    IFrameAPI.createController(element, options, (controller) => {
      EmbedController = controller;
    });
  };

  // Si el script de Spotify no carga (bloqueado, sin red, etc.) en unos segundos,
  // mostramos el enlace de respaldo a Spotify.
  setTimeout(() => {
    if (!apiReady) mostrarFallback();
  }, 4000);

  function mostrarFallback() {
    document.getElementById('fallbackLink').href = TRACK_URL + '#' +
      Math.floor(START_SECONDS / 60) + ':' + String(START_SECONDS % 60).padStart(2, '0');
    document.getElementById('fallback').style.display = 'block';
  }

  document.getElementById('playButton').addEventListener('click', () => {
    if (!EmbedController) {
      mostrarFallback();
      window.open(TRACK_URL, '_blank');
      return;
    }
    // loadUri admite opciones con la posición inicial exacta en ms,
    // así no dependemos de esperar "a ojo" a que cargue el track.
    EmbedController.loadUri(TRACK_URI);
    EmbedController.addListener('playback_update', function onUpdate(e) {
      // en cuanto el reproductor confirma que hay datos cargados, buscamos y reproducimos
      if (e.data.duration > 0) {
        EmbedController.removeListener('playback_update', onUpdate);
        EmbedController.seek(START_MS);
        EmbedController.play();
      }
    });

    document.getElementById('playButton').classList.add('hidden');
    document.getElementById('embed-wrap').classList.add('visible');
  });
</script>

<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
